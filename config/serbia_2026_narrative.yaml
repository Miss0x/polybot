# =============================================================================
# serbia_2026_narrative.yaml — L2 影响分析 / L3 反方与未知 的叙事内容
#
# 原则（质量六道闸之"账本现算"）：报告骨架由数据库现算（L0/L1/L4），
# 本文件只承载"判断性叙事"。当前由人工维护；接入 LLM 后改为草稿+人工审。
# 每条 narrative 的逻辑必须指向 L1 中可回溯的事实，禁止引入账本外事实。
# =============================================================================
election_id: serbia_2026

l2_impacts:
  - title: "门槛数学变化"
    text: "3% 门槛下，小党名单撤回并入学生阵营，使'散党全灭'与'两列对垒'的分歧被部分消解。含义取决于背书党的支持者是否真实转移——历史先例：背书 ≠ 选票转移（2016 年有打折先例）。"
    linked_variables: ["threshold_parties", "coalition"]

  - title: "民调分歧的结构性原因"
    text: "CRTA 逐党测量（小党全灭）vs NSPM 按选票联盟测量（合并计票）——分歧根源是测量菜单不同，非造假。引用任何数字必须带口径。"
    linked_variables: ["polls_sns_vs_students"]

  - title: "竞选议程信号"
    text: "亲政府小报（Informer/Telegraf）的攻击焦点可作为 SNS 民意调研判断的先行指标——它打什么，说明学生名单的软肋在哪。"
    linked_variables: ["student_party", "sns_list"]

l3_unknowns:
  - "武契奇辞任确切时点及总统补选连锁反应（≤90 天）——牵动多个合约"
  - "学生名单抗议 → 投票的转化率，无民调能测"
  - "SPS 最终站队——决定 SNS 多数数学的复杂度"
  - "2023 年式违规争议是否重演（买票/保加利亚火车先例）——影响结算与情绪"

l3_contra_students:   # 若看好反对派必须回答
  - "SNS 执政 14 年、七连胜，选举机器能力有完整记录"
  - "被指亲政府的机构给出 SNS 大幅领先——若为真，反对派叙事不成立"
  - "背书潮的选票转移率历史上打折"

l3_contra_sns:        # 若看好执政方必须回答
  - "诺维萨德事件以来 22 个月的抗议为何这次转化为政党并保持势头？"
  - "CRTA（与斯坦福合作）的独立口径为何长期比亲政府机构悲观？"

l3_break_triggers:
  - "SPS 官宣站队"
  - "学生名单重大分裂"
  - "ODIHR 中期报告负面"
  - "武契奇辞任受阻"
