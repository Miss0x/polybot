# =============================================================================
# serbia_2026_narrative.yaml — L2 影响分析 / L3 反方与未知（通俗版 v2）
#
# 写作标准（用户 2026-09-30 指示）：专业且通俗——像给一个聪明的朋友讲清楚，
# 允许用类比，禁止堆术语；每个判断仍必须能回溯到 L1 的事实。
# =============================================================================
election_id: serbia_2026

l2_impacts:
  - title: "反对派正在把散落的选票装进一个篮子"
    text: "塞尔维亚规则：一个政党得票不到 3%，一席都拿不到。之前反对派分成好几个小党，每个都可能跨不过 3%、白白浪费支持者的票。最近好几个小党宣布'我不参选了，支持学生名单'，等于把散票集中起来。这对学生名单是利好，但有个老问题：小党'宣布支持'，它的选民不一定真的跟过去——2016 年有过类似背书，实际增益打了折扣。"
    linked_variables: ["threshold_parties", "coalition"]

  - title: "两家民调差 10 个点，不是有人造假，是问法不同"
    text: "CRTA 把每个小党单独报给受访者选（小党票数自然低），NSPM 把几个小党合成一个联盟让受访者选（数字自然高）。同一批选民，两种问法出两个数字。所以看任何民调先问一句：这是'拆开问'还是'合着问'。市场现在定价时用的哪组数字，本身就是变量。"
    linked_variables: ["polls_sns_vs_students"]

  - title: "对手打哪里，哪里就可能是最疼的地方"
    text: "Informer 是亲政府小报，基本等于 SNS 的传声筒。它最近集中炒作一名学生之死、把账算到学生名单头上。这透露 SNS 的竞选团队认为学生名单的软肋在这里——把它当'对方牌路预告'读，而不是当事实读。"
    linked_variables: ["student_party", "sns_list"]

l3_watch:   # 系统在盯的事：不是让你去查，是让你知道"哪些事还没定"
  - q: "武契奇到底哪天正式辞去总统？"
    why: "他一辞任，宪法要求 90 天内选新总统——Polymarket 上好几个合约直接跟着这个时间点走，时点变了价格就得重估。"
  - q: "上街抗议的人，投票日真的会去投票吗？"
    why: "抗议和投票是两回事：上街是情绪，投票要跑一趟投票站。没有任何民调能测出这个转化率，而它是学生名单成败的命门。"
  - q: "SPS（社会党）最后跟谁结盟？"
    why: "SNS 需要 SPS 凑够 126 席的多数。它站哪边，直接改写'谁能组阁'的算术题。"
  - q: "会不会重演 2023 年的选举争议？"
    why: "上次选举有买票指控和事后抗议。一旦重演，市场会剧烈波动，结算本身也可能有争议——这是持有合约过夜的最大风险之一。"

l3_contra_students:   # 用法：如果你想买学生名单/反对派，先过这关
  - "SNS 执政 14 年，过去 7 次选举全赢。它有成熟的动员机器、媒体版面控制、基层拉票网络——这些民调测不出来，但每次都真实兑现。你凭什么认为这次是例外？"
  - "亲政府背景的民调机构说 SNS 大幅领先 10 多个点。如果他们这次大体是对的，'学生名单要赢'从一开始就不成立。你可以怀疑他们，但先去看他们过去几次选举的最终预测误差（回测数据后续补进报告）。"
  - "几个小党宣布支持学生名单，不等于他们的选民跟过来。2023 年 SPN 大联盟拿到 65 席后照样分裂。这次背书潮的转化率有任何证据吗？"

l3_contra_sns:        # 用法：如果你想买 SNS/执政方，先过这关
  - "学生的抗议从 2024 年底诺维萨德车站事故开始，持续快两年不但没散，还转成了正式参选的政党。如果只是发泄不满，撑不了这么久——你把持续两年的组织当'乌合之众'，依据是什么？"
  - "CRTA 是独立机构（还和斯坦福大学合作），它的口径长期显示 SNS 更弱。你不能把亲政府机构的数字当真相、把独立机构的数字当噪音——这个选择本身就是立场，不是分析。"

l3_break_triggers:
  - "SPS 宣布和谁结盟（改写组阁算术）"
  - "学生名单内部闹分裂（单一名单假设破产）"
  - "国际观察团（ODIHR）发出严厉批评（违规风险升级）"
  - "武契奇辞职程序出岔子（时间表重排）"

# 保留字段（供后续模型页/存档引用，不在 index 主页渲染）
legacy_l3_unknowns: true
