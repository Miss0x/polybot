    direction: 0
    strength: weak
    evidence_type: context
    note: "油价波动是航运中断的结果而非原因"

  - event_type: oil_market_impact
    market_condition: permanent_peace_deal
    direction: 0
    strength: weak
    evidence_type: context
    note: "油价波动反映市场情绪，不直接影响和平协议"
