election_id: serbia_2026
vote_date: "2026-10-25"

feeds:
  # ---- 原生 RSS（直采）----
  - id: balkan_insight_serbia
    name: "Balkan Insight (BIRN) Serbia"
    url: "https://balkaninsight.com/category/bi/serbia/feed/"
    lang: en
    source_class: core
    tier: A2

  - id: danas
    name: "Danas"
    url: "https://www.danas.rs/feed/"
    lang: sr
    source_class: core
    tier: A2

  - id: krik
    name: "KRIK"
    url: "https://krik.rs/feed/"
    lang: sr
    source_class: core
    tier: A2

  # ---- Google News 万能适配器 ----
  - id: gn_n1
    name: "N1 (via Google News)"
    url: "https://news.google.com/rss/search?q=site:rs.n1info.com+when:2d&hl=sr&gl=RS&ceid=RS:sr"
    lang: sr
    source_class: core
    tier: A2

  - id: gn_vreme
    name: "Vreme (via Google News)"
    url: "https://news.google.com/rss/search?q=site:vreme.com+when:3d&hl=sr&gl=RS&ceid=RS:sr"
    lang: sr
    source_class: core
    tier: A2

  - id: gn_izbori_sr
    name: "Google News SR izbori"
    url: "https://news.google.com/rss/search?q=izbori+OR+%22lista+studenata%22+OR+anketa+when:2d&hl=sr&gl=RS&ceid=RS:sr"
    lang: sr
    source_class: core
    tier: A2

  - id: gn_vucic_sr
    name: "Google News SR vucic"
    url: "https://news.google.com/rss/search?q=vu%C4%8Di%C4%87+when:2d&hl=sr&gl=RS&ceid=RS:sr"
    lang: sr
    source_class: core
    tier: A2

  - id: gn_rik
    name: "Google News RIK"
    url: "https://news.google.com/rss/search?q=site:rik.parlament.gov.rs+OR+%22izborna+komisija%22+when:7d&hl=sr&gl=RS&ceid=RS:sr"
